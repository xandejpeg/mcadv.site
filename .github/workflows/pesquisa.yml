name: Radar - Pesquisa (rascunho)

on:
  schedule:
    - cron: "0 21 * * 1"   # seg 18:00 BRT — tributário/fiscal
    - cron: "0 21 * * 3"   # qua 18:00 BRT — trabalhista
    - cron: "0 9  * * 5"   # sex 06:00 BRT — previdenciário
  workflow_dispatch:
    inputs:
      area:
        description: Área a pesquisar
        type: choice
        options:
          - tributario-fiscal
          - trabalhista
          - previdenciario

permissions:
  contents: write
  issues: write

concurrency:
  group: radar-commit
  cancel-in-progress: false

jobs:
  pesquisa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Definir área
        id: area
        run: |
          case "${{ github.event.schedule }}" in
            "0 21 * * 1") AREA=tributario-fiscal ;;
            "0 21 * * 3") AREA=trabalhista ;;
            "0 9 * * 5")  AREA=previdenciario ;;
            *) AREA="${{ github.event.inputs.area }}" ;;
          esac
          if [ -z "$AREA" ]; then AREA=tributario-fiscal; fi
          echo "area=$AREA" >> "$GITHUB_OUTPUT"
          echo "Área selecionada: $AREA"

      - name: Instalar dependências do engine
        working-directory: engine
        run: npm ci || npm install

      - name: Coletar
        working-directory: engine
        run: node src/collect.js --area=${{ steps.area.outputs.area }} --dias=7

      - name: Renderizar rascunho
        working-directory: engine
        run: node src/render.js --area=${{ steps.area.outputs.area }} --draft

      - name: Resumo da execução
        run: |
          AREA=${{ steps.area.outputs.area }}
          DATA=$(TZ=America/Sao_Paulo date +%F)
          RAW="data/raw/$AREA/$DATA.json"
          {
            echo "## Radar — pesquisa ($AREA, $DATA)"
            if [ -f "$RAW" ]; then
              node -e '
                const r=require("./"+process.argv[1]);
                const ok=r.fontes_consultadas.filter(f=>f.status==="ok").length;
                const fail=r.fontes_consultadas.length-ok;
                console.log(`- Fontes OK: ${ok} / falhas: ${fail}`);
                console.log(`- Itens coletados: ${r.total_coletado} (únicos: ${r.total_unico})`);
              ' "$RAW"
            else
              echo "- Raw não gerado."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commitar rascunho
        run: |
          AREA=${{ steps.area.outputs.area }}
          DATA=$(TZ=America/Sao_Paulo date +%F)
          git config user.name "mcap-radar[bot]"
          git config user.email "actions@github.com"
          git add "data/raw/$AREA" "content/$AREA" || true
          if git diff --cached --quiet; then
            echo "Nada a commitar."
          else
            git commit -m "radar($AREA): pesquisa $DATA"
            ok=0
            for i in 1 2 3 4 5; do
              if git push; then ok=1; break; fi
              git pull --rebase --autostash || git rebase --abort || true
              sleep 4
            done
            [ $ok -eq 1 ] || { echo "push falhou apos 5 tentativas"; exit 1; }
          fi

      - name: Abrir issue em caso de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = `Radar: falha na pesquisa (${{ steps.area.outputs.area }})`;
            const body = `Falha no workflow **Pesquisa** em ${new Date().toISOString()}.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const abertas = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'radar-falha' });
            const existente = abertas.data.find(i => i.title === titulo);
            if (existente) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existente.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: titulo, body, labels: ['radar-falha'] });
            }
