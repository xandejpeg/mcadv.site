name: Radar - Publicação

on:
  schedule:
    - cron: "0 23 * * 1"   # seg 20:00 BRT — tributário/fiscal
    - cron: "0 23 * * 3"   # qua 20:00 BRT — trabalhista
    - cron: "0 11 * * 5"   # sex 08:00 BRT — previdenciário
  workflow_dispatch:
    inputs:
      area:
        description: Área a publicar
        type: choice
        options:
          - tributario-fiscal
          - trabalhista
          - previdenciario

permissions:
  contents: write
  issues: write
  models: read

concurrency:
  group: radar-commit
  cancel-in-progress: false

jobs:
  publicacao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCAP_USE_MODELS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Definir área
        id: area
        run: |
          case "${{ github.event.schedule }}" in
            "0 23 * * 1") AREA=tributario-fiscal ;;
            "0 23 * * 3") AREA=trabalhista ;;
            "0 11 * * 5") AREA=previdenciario ;;
            *) AREA="${{ github.event.inputs.area }}" ;;
          esac
          if [ -z "$AREA" ]; then AREA=tributario-fiscal; fi
          echo "area=$AREA" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências do engine
        working-directory: engine
        run: npm ci || npm install

      - name: Auto-cura (coletar se faltar o raw do dia)
        working-directory: engine
        run: |
          AREA=${{ steps.area.outputs.area }}
          DATA=$(TZ=America/Sao_Paulo date +%F)
          if [ ! -f "../data/raw/$AREA/$DATA.json" ]; then
            echo "Raw ausente — coletando agora."
            node src/collect.js --area=$AREA --dias=7
          fi

      - name: Renderizar relatório final
        working-directory: engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: node src/render.js --area=${{ steps.area.outputs.area }}

      - name: Remover rascunho e publicar feeds
        working-directory: engine
        run: |
          AREA=${{ steps.area.outputs.area }}
          DATA=$(TZ=America/Sao_Paulo date +%F)
          rm -f "../content/$AREA/$DATA.draft.md"
          node src/publish.js
          node src/newsletter.js

      - name: Commitar publicação
        run: |
          AREA=${{ steps.area.outputs.area }}
          DATA=$(TZ=America/Sao_Paulo date +%F)
          git config user.name "mcap-radar[bot]"
          git config user.email "actions@github.com"
          git add content public data || true
          if git diff --cached --quiet; then
            echo "Nada a commitar."
          else
            git commit -m "radar($AREA): publicação $DATA"
            ok=0
            for i in 1 2 3 4 5; do
              if git push; then ok=1; break; fi
              git pull --rebase --autostash || git rebase --abort || true
              sleep 4
            done
            [ $ok -eq 1 ] || { echo "push falhou apos 5 tentativas"; exit 1; }
          fi

      - name: Disparar consumidores
        working-directory: engine
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "DISPATCH_TOKEN ausente — pulando notificação de consumidores."
            exit 0
          fi
          node src/dispatch.js

      - name: Abrir issue em caso de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = `Radar: falha na publicação (${{ steps.area.outputs.area }})`;
            const body = `Falha no workflow **Publicação** em ${new Date().toISOString()}.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const abertas = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'radar-falha' });
            const existente = abertas.data.find(i => i.title === titulo);
            if (existente) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existente.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: titulo, body, labels: ['radar-falha'] });
            }
